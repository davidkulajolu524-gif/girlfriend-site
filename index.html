<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>One Important Question ❤️</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="question-page">

    <!-- Floating hearts -->
    <div class="hearts">
        <span>❤️</span>
        <span>💕</span>
        <span>💗</span>
        <span>💖</span>
        <span>❤️</span>
        <span>💕</span>
    </div>


    <main class="question-container">

        <div class="love-card">

            <div class="emoji">
                💗
            </div>

            <p class="small-text">
                I have a very important question...
            </p>

            <h1>
                Will you be<br>
                my girlfriend?
            </h1>

            <p class="message">
                I've been meaning to ask you something...
                and I hope you'll say yes. 🥹
            </p>

            <div class="buttons">

                <button
                    id="yesButton"
                    class="yes-button"
                >
                    Yes ❤️
                </button>

                <button
                    id="noButton"
                    class="no-button"
                >
                    No 😭
                </button>

            </div>

        </div>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
