<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>It's a Date! ❤️</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="question-page">

    <div class="hearts">
        <span>❤️</span>
        <span>💕</span>
        <span>💗</span>
        <span>💖</span>
        <span>❤️</span>
        <span>💕</span>
        <span>💓</span>
        <span>💞</span>
    </div>


    <main class="question-container">

        <div class="love-card confirmation-card">

            <div class="big-heart">
                🥰
            </div>

            <p class="small-text">
                Well...
            </p>

            <h1>
                IT'S A DATE! ❤️
            </h1>

            <p class="message">
                I can't wait to spend this time with you.
            </p>


            <div class="date-summary">

                <div class="summary-item">
                    <span>📍</span>
                    <div>
                        <small>We're going to</small>
                        <strong id="finalLocation">---</strong>
                    </div>
                </div>


                <div class="summary-item">
                    <span>🍴</span>
                    <div>
                        <small>We're eating</small>
                        <strong id="finalFood">---</strong>
                    </div>
                </div>


                <div class="summary-item">
                    <span>📅</span>
                    <div>
                        <small>Date</small>
                        <strong id="finalDate">---</strong>
                    </div>
                </div>


                <div class="summary-item">
                    <span>⏰</span>
                    <div>
                        <small>Time</small>
                        <strong id="finalTime">---</strong>
                    </div>
                </div>

            </div>


            <p class="final-message">
                I really can't wait to see you. ❤️
            </p>

        </div>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
