<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>I Knew It ❤️</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="question-page">

    <!-- Floating hearts -->
    <div class="hearts">
        <span>❤️</span>
        <span>💕</span>
        <span>💗</span>
        <span>💖</span>
        <span>❤️</span>
        <span>💕</span>
        <span>💓</span>
        <span>💞</span>
    </div>


    <main class="question-container">

        <div class="love-card celebration-card">

            <div class="big-heart">
                ❤️
            </div>

            <p class="small-text">
                I had a feeling...
            </p>

            <h1>
                I KNEW YOU<br>
                WOULD SAY YES! 🥹
            </h1>

            <p class="message">
                You just made me the happiest person ever.
                I promise this is only the beginning of something beautiful. ❤️
            </p>

            <button
                id="continueButton"
                class="yes-button"
            >
                Let's plan our first date 💕
            </button>

        </div>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
