<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our First Date ❤️</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="date-page">

    <!-- Floating hearts -->
    <div class="hearts">
        <span>❤️</span>
        <span>💕</span>
        <span>💗</span>
        <span>💖</span>
        <span>❤️</span>
        <span>💕</span>
    </div>


    <main class="date-container">

        <div class="date-card">

            <!-- Header -->

            <header class="date-header">

                <div class="date-emoji">
                    🌹
                </div>

                <p class="small-text">
                    Now for the important part...
                </p>

                <h1>
                    Let's plan<br>
                    our first date ❤️
                </h1>

                <p class="date-intro">
                    You get to choose everything.
                    Pick whatever makes you happy. 🥰
                </p>

            </header>


            <!-- WHERE -->

            <section class="choice-section">

                <h2>
                    📍 Where should we go?
                </h2>

                <div class="choice-grid">

                    <button
                        class="choice-card"
                        data-type="location"
                        data-value="Cinema"
                    >
                        <span>🍿</span>
                        <strong>BOC</strong>
                    </button>


                    <button
                        class="choice-card"
                        data-type="location"
                        data-value="Restaurant"
                    >
                        <span>🍽️</span>
                        <strong>CFC</strong>
                    </button>


                    <button
                        class="choice-card"
                        data-type="location"
                        data-value="Park"
                    >
                        <span>🌳</span>
                        <strong>Love Garden</strong>
                    </button>


                    <button
                        class="choice-card"
                        data-type="location"
                        data-value="Café"
                    >
                        <span>☕</span>
                        <strong>Library</strong>
                    </button>


                    <button
                        class="choice-card"
                        data-type="location"
                        data-value="Bowling"
                    >
                        <span>🎳</span>
                        <strong>Bowling</strong>
                    </button>


                    <button
                        class="choice-card"
                        data-type="location"
                        data-value="Somewhere special"
                    >
                        <span>✨</span>
                        <strong>Somewhere special</strong>
                    </button>

                </div>

            </section>


            <!-- FOOD -->

            <section class="choice-section">

                <h2>
                    🍴 What should we eat?
                </h2>

                <div class="choice-grid">

                    <button
                        class="choice-card"
                        data-type="food"
                        data-value="Pizza"
                    >
                        <span>🍕</span>
                        <strong>Pizza</strong>
                    </button>


                    <button
                        class="choice-card"
                        data-type="food"
                        data-value="Burgers"
                    >
                        <span>🍔</span>
                        <strong>Burgers</strong>
                    </button>


                    <button
                        class="choice-card"
                        data-type="food"
                        data-value="Chicken"
                    >
                        <span>🍗</span>
                        <strong>Chicken</strong>
                    </button>


                    <button
                        class="choice-card"
                        data-type="food"
                        data-value="Pasta"
                    >
                        <span>🍝</span>
                        <strong>Pasta</strong>
                    </button>


                    <button
                        class="choice-card"
                        data-type="food"
                        data-value="Sushi"
                    >
                        <span>🍣</span>
                        <strong>Sushi</strong>
                    </button>


                    <button
                        class="choice-card"
                        data-type="food"
                        data-value="Dessert"
                    >
                        <span>🍦</span>
                        <strong>Dessert</strong>
                    </button>

                </div>

            </section>


            <!-- DATE -->

            <section class="choice-section">

                <h2>
                    📅 When should we go?
                </h2>

                <div class="date-inputs">

                    <div class="input-group">

                        <label for="date">
                            Choose a date
                        </label>

                        <input
                            type="date"
                            id="date"
                        >

                    </div>


                    <div class="input-group">

                        <label for="time">
                            Choose a time
                        </label>

                        <input
                            type="time"
                            id="time"
                        >

                    </div>

                </div>

            </section>


            <!-- CONFIRM -->

            <section class="confirm-section">

                <p id="selectionMessage">
                    Choose your date details above ❤️
                </p>

                <button
                    id="confirmButton"
                    class="confirm-button"
                >
                    Confirm Our Date ❤️
                </button>

            </section>

        </div>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
